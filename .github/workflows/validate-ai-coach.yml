name: Validate Comprehension AI Coach
on:
  push:
    branches: ["main"]
    paths:
      - "answer-ladder.html"
      - "answer-ladder.js"
      - "answer-ladder-cloud.js"
      - "learner-sync.js"
      - "quick-practice.js"
      - "explain.js"
      - "gpt-actions-openapi.yaml"
      - "gpt-actions-setup.html"
      - "version.json"
      - ".github/workflows/validate-ai-coach.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          node --check answer-ladder.js
          node --check answer-ladder-cloud.js
          node --check learner-sync.js
          node --check quick-practice.js
          node --check explain.js
      - name: Check version, features and schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const version=JSON.parse(fs.readFileSync('version.json'));
          const html=fs.readFileSync('answer-ladder.html','utf8');
          const cloud=fs.readFileSync('answer-ladder-cloud.js','utf8');
          const schema=fs.readFileSync('gpt-actions-openapi.yaml','utf8');
          assert.equal(version.version,'0.6.0');
          for(const id of ['ai','consent','sync','askGPT','gptActions','parentEmail','parentPassword','exportHistory','showAllHistory'])assert.match(html,new RegExp('id="'+id+'"'));
          assert.match(cloud,/getIdToken/);
          assert.match(cloud,/families/);
          const learner=fs.readFileSync('learner-sync.js','utf8');
          assert.match(learner,/signInAnonymously/);
          assert.match(learner,/approvedDevices/);
          assert.match(learner,/comprehension-local-saved/);
          assert.match(cloud,/serverTimestamp/);
          assert.match(cloud,/navigator.clipboard/);
          assert.match(schema,/operationId: coachEnglishAnswer/);
          console.log('AI Coach static checks passed');
          NODE
